<style>

</style><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script></head><body>
<div class="ui"><h1>Test generator</h1><div class="m">Savollarni quyidagi formatda kiriting (savollar orasida bo'sh qator):</div>
<textarea id="q" placeholder="1. Suvning formulasi qaysi?
A) CO2
B) H2O
C) NaCl
D) O2
Javob: B

2. Keyingi savol...
A) ...
B) ...
C) ...
D) ...
Javob: A"></textarea>
<div class="r"><label>Savollar soni (1–90)<input id="n" type="number" min="1" max="90" value="30"></label>
<label>O'quvchilar soni<input id="s" type="number" min="1" max="500" value="25"></label>
<label>Test nomi<input id="t" value="Kimyo testi"></label>
<label>Kitob raqami (boshlanishi)<input id="b" type="number" min="1" max="999" value="1"></label>
<label>Shrift<select id="ff"><option value="'Times New Roman',serif">Times New Roman</option><option value="Arial,sans-serif">Arial</option><option value="Georgia,serif">Georgia</option><option value="Verdana,sans-serif">Verdana</option><option value="Tahoma,sans-serif">Tahoma</option><option value="'Courier New',monospace">Courier New</option></select></label>
<label>Shrift o'lchami (pt)<input id="fs" type="number" min="7" max="16" step="0.5" value="10"></label>
<label>Orqa fon rasmi<input id="bg" type="file" accept="image/*"></label>
<label>Fon shaffofligi<input id="bo" type="range" min="5" max="60" value="15"></label></div>
<div class="r"><button onclick="gen()">Generatsiya</button><button class="o" onclick="pdf('t')">Testlar PDF</button><button class="o" onclick="pdf('s')">Titullar PDF</button><button class="o" onclick="pdf('k')">Kalitlar PDF</button></div>
<div id="msg" class="m"></div>
<hr><h2 style="font-size:17px">Tekshirish</h2><div class="m">Titul rasmini oling yoki tanlang (4 ta burchak kvadrati to'liq ko'rinsin, yorug' joyda, varaq tekis). Kalitlar shu qurilmada oxirgi "Generatsiya"dan keyin saqlanadi.</div>
<div class="r"><input id="f" type="file" accept="image/*" multiple></div><button onclick="chk()">Tekshirish</button><div id="res" style="margin-top:10px;overflow-x:auto"></div></div>
<div class="tests" id="T"></div><div class="sheets" id="S"></div><div class="keys" id="K"></div>
<script>
const $=id=>document.getElementById(id),L='ABCD';
try{$('q').value=localStorage.getItem('q')||''}catch(e){}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function parse(t){return t.split(/\n\s*\n/).map(b=>{const l=b.trim().split('\n').map(s=>s.trim()).filter(Boolean);if(l.length<6)return null;
const m=l[l.length-1].match(/javob\s*[:\-]?\s*([A-D])/i);if(!m)return null;
return{q:l.slice(0,l.length-5).join(' ').replace(/^\d+[\).]\s*/,''),o:l.slice(l.length-5,l.length-1).map(s=>s.replace(/^[A-Da-d][\).]\s*/,'')),a:L.indexOf(m[1].toUpperCase())}}).filter(Boolean)}
function sheetOld(T,code,N){let h=`<section class="pg sh"><i class="mk" style="left:0;top:0"></i><i class="mk" style="right:0;top:0"></i><i class="mk" style="left:0;bottom:0"></i><i class="mk" style="right:0;bottom:0"></i><h3>${esc(T)} — Javoblar varag'i</h3><div>F.I.Sh: ______________________________ Sana: __________</div><div class="idb"><b>Variant kodi</b>`;
for(const d of code)h+='<div class="col">'+[...Array(10).keys()].map(n=>`<span class="b${n==d?' f':''}">${n}</span>`).join('')+'</div>';
h+='</div><div class="grid">';
for(let c=0;c<N/30;c++){h+='<div>';for(let r=1;r<=30;r++)h+=`<div class="row"><em>${c*30+r}</em>`+[...L].map(l=>`<span class="b">${l}</span>`).join('')+'</div>';h+='</div>'}
return h+'</div></section>'}
function gen(){const bank=parse($('q').value),N=Math.max(1,Math.min(90,Math.round(+$('n').value)||30)),S=+$('s').value,T=$('t').value,B=Math.max(1,Math.round(+$('b').value)||1),rs=document.documentElement.style;rs.setProperty('--tf',$('ff').value);rs.setProperty('--ts',($('fs').value||10)+'pt');rs.setProperty('--bo',$('bo').value/100);if(B+S-1>999){$('msg').textContent='Kitob raqami 999 dan oshib ketadi.';return}
try{localStorage.setItem('q',$('q').value)}catch(e){}
if(bank.length<N){$('msg').textContent=`Bazada ${bank.length} ta to'g'ri formatdagi savol bor, ${N} ta kerak.`;return}
$('T').innerHTML='';const KS={};let t='',s='',k='<h3>Javob kalitlari</h3><table><tr><th>Kod</th><th>Kalit</th></tr>';
for(let i=1;i<=S;i++){const code=String(B+i-1).padStart(3,'0');
const qs=shuffle(bank.slice()).slice(0,N).map(x=>{const ix=shuffle([0,1,2,3]);return{q:x.q,o:ix.map(j=>x.o[j]),a:ix.indexOf(x.a)}});
buildTest(T,code,qs);
KS[code]=qs.map(x=>L[x.a]).join('');s+=sheet2(T,code,N);
k+=`<tr><td>${code}</td><td style="font-family:monospace;word-break:break-all">${qs.map(x=>L[x.a]).join('')}</td></tr>`}
try{localStorage.setItem('keys',JSON.stringify({n:N,KS}))}catch(e){}$('S').innerHTML=s;$('K').innerHTML=k+'</table>';
$('msg').textContent=`${S} ta variant yaratildi. Pastda ko'rib, chop etishingiz mumkin.`}
const MK=[[12,12],[198,12],[12,285],[198,285]],cp=(d,n)=>[104+n*7,41+d*6.5],bp=(c,r,k)=>[34+c*62+k*9,70+r*6.2];
function sheet2(T,code,N){let h="<section class='pg sh'>";
MK.forEach(([x,y])=>h+=`<i class='mk' style='left:${x-4}mm;top:${y-4}mm'></i>`);
const tx=(x,y,s,c,st)=>`<div class='tx${c?' c':''}' style='left:${x}mm;top:${y}mm;${st||''}'>${s}</div>`;
h+=tx(22,18,esc(T)+" — javoblar varag'i",0,'font-weight:bold;font-size:14pt');
['F.I.Sh:','Sana:','Sinf / guruh:'].forEach((t,i)=>h+=tx(22,32+i*9,t+' ______________________'));
h+=tx(101,25,'Variant kodi: '+code,0,'font-weight:bold');
for(let k=0;k<10;k++)h+=tx(cp(0,k)[0],30,k,1,'font-size:7pt');
for(let d=0;d<3;d++)for(let k=0;k<10;k++){const[x,y]=cp(d,k);h+=`<span class='bb${code[d]==k?' bf':''}' style='left:${x-2.6}mm;top:${y-2.6}mm'></span>`}
for(let c=0;c<Math.ceil(N/30);c++){const R=Math.min(30,N-c*30);for(let g=1;g<6;g+=2)if(g*5<R)h+=`<div class='bd' style='left:${21+c*62}mm;top:${70+g*31-3.1}mm;height:${Math.min(5,R-g*5)*6.2}mm'></div>`;
for(let k=0;k<4;k++)h+=tx(bp(c,0,k)[0],61,L[k],1,'font-weight:bold;font-size:9pt');
for(let r=0;r<R;r++){const y=bp(c,r,0)[1];h+=tx(16+c*62,y-2,c*30+r+1,0,'width:12mm;text-align:right;font-size:8pt');
for(let k=0;k<4;k++){const x=bp(c,r,k)[0];h+=`<span class='bb' style='left:${x-2.6}mm;top:${y-2.6}mm'></span>`}}}
h+=tx(22,268,"Doirani qora ruchka bilan to'liq bo'yang. Burchakdagi qora kvadratlarni yopmang.",0,'font-size:8pt');
return h+'</section>'}
async function loadImg(f){const im=await createImageBitmap(f),w=im.width,h=im.height,sc=Math.min(1,1800/Math.max(w,h)),c=document.createElement('canvas'),x=c.getContext('2d');
if(w>h){c.width=Math.round(h*sc);c.height=Math.round(w*sc);x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(im,0,0,w*sc,h*sc)}else{c.width=Math.round(w*sc);c.height=Math.round(h*sc);x.drawImage(im,0,0,c.width,c.height)}return c}
function bin(c){const W=c.width,H=c.height,d=c.getContext('2d').getImageData(0,0,W,H).data,g=new Float32Array(W*H),W1=W+1,I=new Float64Array(W1*(H+1)),b=new Uint8Array(W*H),r=Math.round(W*.03);
for(let i=0;i<W*H;i++)g[i]=.299*d[4*i]+.587*d[4*i+1]+.114*d[4*i+2];
for(let y=0;y<H;y++){let s=0;for(let x=0;x<W;x++){s+=g[y*W+x];I[(y+1)*W1+x+1]=I[y*W1+x+1]+s}}
for(let y=0;y<H;y++){const y0=Math.max(0,y-r),y1=Math.min(H,y+r+1);for(let x=0;x<W;x++){const x0=Math.max(0,x-r),x1=Math.min(W,x+r+1),m=(I[y1*W1+x1]-I[y0*W1+x1]-I[y1*W1+x0]+I[y0*W1+x0])/((y1-y0)*(x1-x0)),v=g[y*W+x];b[y*W+x]=v<m*.75&&v<160?1:0}}
return{W,H,b}}
function marks({W,H,b}){const seen=new Uint8Array(W*H),side=W*8/210,c=[],st=[];
for(let i=0;i<W*H;i++){if(!b[i]||seen[i])continue;let x0=W,x1=0,y0=H,y1=0,n=0;st.push(i);seen[i]=1;
while(st.length){const p=st.pop(),x=p%W,y=(p-x)/W;n++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
const nb=[];if(x>0)nb.push(p-1);if(x<W-1)nb.push(p+1);if(y>0)nb.push(p-W);if(y<H-1)nb.push(p+W);
for(const q of nb)if(b[q]&&!seen[q]){seen[q]=1;st.push(q)}}
const w=x1-x0+1,h=y1-y0+1;if(w>.7*side&&w<1.5*side&&h>.7*side&&h<1.5*side&&Math.abs(w-h)<.3*Math.max(w,h)&&n>.75*w*h)c.push([(x0+x1)/2,(y0+y1)/2])}
if(c.length<4)return null;
const P=[[0,0],[W,0],[0,H],[W,H]].map(([a,e])=>c.reduce((m,q)=>(q[0]-a)**2+(q[1]-e)**2<(m[0]-a)**2+(m[1]-e)**2?q:m));
return new Set(P.map(String)).size==4?P:null}
function homog(P,Q){const A=[];for(let i=0;i<4;i++){const[u,v]=P[i],[x,y]=Q[i];A.push([u,v,1,0,0,0,-u*x,-v*x,x],[0,0,0,u,v,1,-u*y,-v*y,y])}
for(let i=0;i<8;i++){let m=i;for(let r=i+1;r<8;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;[A[i],A[m]]=[A[m],A[i]];for(let r=0;r<8;r++)if(r!==i){const f=A[r][i]/A[i][i];for(let c=i;c<9;c++)A[r][c]-=f*A[i][c]}}
return A.map((r,i)=>r[8]/r[i])}
const mp=(h,u,v)=>{const w=h[6]*u+h[7]*v+1;return[(h[0]*u+h[1]*v+h[2])/w,(h[3]*u+h[4]*v+h[5])/w]};
function fv(B,h,u,v){let n=0,k=0;for(let a=-3;a<=3;a++)for(let c=-3;c<=3;c++){if(a*a+c*c>9)continue;const[x,y]=mp(h,u+a*.5,v+c*.5),xi=Math.round(x),yi=Math.round(y);k++;if(xi>=0&&yi>=0&&xi<B.W&&yi<B.H&&B.b[yi*B.W+xi])n++}return n/k}
function pk(v,lb){const m=Math.max(...v);if(m<.35)return'-';return v.filter(x=>x>Math.max(.35,.6*m)).length>1?'*':lb[v.indexOf(m)]}
async function chk(){let K=null;try{K=JSON.parse(localStorage.getItem('keys'))}catch(e){}
if(!K){$('res').textContent='Avval shu qurilmada "Generatsiya" qiling: kalitlar shunda saqlanadi.';return}
const fs=[...$('f').files];if(!fs.length){$('res').textContent='Rasm tanlang.';return}
let h="<table><tr><th>Fayl</th><th>Variant</th><th>To'g'ri</th><th>Foiz</th><th>Bo'sh/ko'p</th></tr>";
for(let i=0;i<fs.length;i++){$('res').textContent=`Tekshirilmoqda ${i+1}/${fs.length}...`;await new Promise(r=>setTimeout(r));
try{const B=bin(await loadImg(fs[i])),m=marks(B);if(!m)throw'burchak kvadratlari topilmadi';const hm=homog(MK,m);
const code=[0,1,2].map(d=>pk([...Array(10).keys()].map(k=>fv(B,hm,...cp(d,k))),'0123456789')).join('');
if(!K.KS[code])throw'variant kodi noaniq ('+code+')';
const a=[...Array(K.n).keys()].map(q=>pk([0,1,2,3].map(k=>fv(B,hm,...bp(Math.floor(q/30),q%30,k))),L)),key=K.KS[code],ok=a.filter((x,q)=>x==key[q]).length,bl=a.filter(x=>x=='-'||x=='*').length;
h+=`<tr><td>${esc(fs[i].name)}</td><td>${code}</td><td>${ok}/${K.n}</td><td>${Math.round(1000*ok/K.n)/10}%</td><td>${bl}</td></tr>`}
catch(e){h+=`<tr><td>${esc(fs[i].name)}</td><td colspan=4>XATO: ${esc(e.message||e)} - qo'lda tekshiring</td></tr>`}}
$('res').innerHTML=h+'</table>'}
function buildTest(T,code,qs){const host=$('T');let cols;
const np=()=>{const pg=document.createElement('section');pg.className='pg tpg';pg.innerHTML=`<div class="tbgi"></div><div class="th"><b>${esc(T)}</b><span class="kn">Kitob № ${code}</span></div><div class="nm">F.I.Sh: ______________________________ &nbsp; Sana: ____________</div><div class="cols"></div>`;host.appendChild(pg);cols=pg.querySelector('.cols')};
np();qs.forEach((x,j)=>{const d=document.createElement('div');d.className='qi';d.innerHTML=`<b>${j+1}.</b> ${esc(x.q)}<br>`+x.o.map((o,k)=>`${L[k]}) ${esc(o)}`).join('<br>');cols.appendChild(d);
if(cols.scrollWidth>cols.clientWidth+2&&cols.children.length>1){cols.removeChild(d);np();cols.appendChild(d)}})}
$('bg').onchange=async()=>{const f=$('bg').files[0],rs=document.documentElement.style;if(!f){rs.removeProperty('--bgurl');return}
const im=await createImageBitmap(f),k=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);rs.setProperty('--bgurl',`url(${c.toDataURL('image/jpeg',.8)})`)};
function pdf(k){if(!$('T').innerHTML){$('msg').textContent='Avval "Generatsiya" tugmasini bosing.';return}
const w=document.createElement('div');w.className='x';w.innerHTML=$({t:'T',s:'S',k:'K'}[k]).innerHTML;
if(k=='k'){w.style.padding='12mm';w.style.boxSizing='border-box'}
$('msg').textContent='PDF tayyorlanmoqda, kuting...';
html2pdf().set({margin:0,filename:{t:'testlar',s:'titullar',k:'kalitlar'}[k]+'.pdf',image:{type:'jpeg',quality:.95},html2canvas:{scale:k=='s'?2:1.5,backgroundColor:'#fff'},jsPDF:{unit:'mm',format:'a4'},pagebreak:{mode:['css','legacy'],after:'.pg',avoid:'.qi'}}).from(w).save().then(()=>{$('msg').textContent='PDF yuklab olindi.'}).catch(()=>{$('msg').textContent='Xatolik yuz berdi. O\'quvchilar sonini kamaytirib ko\'ring.'})}
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})</script></body></html>
